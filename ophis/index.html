    <script>

        // Add cache buster to eliminate possibility of browser fetching a cached version of a local file instead of the actual one.
        // Important for when you're making iterative edits and all of a sudden your changes aren't taking effect.
        var cacheBuster = Math.floor(Math.random() * 99999999);

        var styleElem = document.createElement("link");
        styleElem.rel = "stylesheet";
        styleElem.type = "text/css";
        styleElem.href = "./src/ophis.css?v=" + cacheBuster;
        document.getElementsByTagName('head')[0].appendChild(styleElem);
        
        var srcFiles = [
            "ophis_logging",
            "ophis_utils",
            "ophis_config",
            "ophis_dependencies",
            "ophis_model__params",
            "ophis_model__validation",
            "ophis_model__sorting",
            "ophis_model__operations",
            "ophis_model__persistence",
            "ophis_controller",
            "ophis_view__strings",
            "ophis_view__config",
            "ophis_view__utils",
            "ophis_view__rebuild",
            "ophis_view__output",
            "ophis_view__settings",
            "ophis_view__chart_config",
            "ophis_view__chart",
            "ophis_view__chart_datasets",
            "ophis_view__export",
            "ophis_view",
            "ophis_unit_tests",
            "ophis_main",
            "scratchpad",
        ];

        var lastScriptElem = null;

        for ( var i = 0; i < srcFiles.length; i++ ) {
            var ithSrcFile = srcFiles[i];
            var ithScriptElem = document.createElement("script");
            ithScriptElem.defer = true;
            ithScriptElem.async = false;
            ithScriptElem.src = "./src/"+ithSrcFile+".js?v=" + cacheBuster;
            document.body.appendChild(ithScriptElem);

            lastScriptElem = ithScriptElem;

            // setTimeout(function(scriptElem) {
                
            // }, i*100, ithScriptElem);
        }

        // Electron called init() from main.js on did-finish-load; the browser bridge does the same
        // once the last renderer script above has executed.
        window.ophisBrowserBridge.start(lastScriptElem);
    </script>
