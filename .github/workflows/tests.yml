# Runs every test suite on every push and pull request.
#   natorion — the stand-alone self-check, the browser test in headless
#              Chromium, and the parity test against the original Ophis v12 source.
#   web      — Ophis Web's unit tests, the cycle-echo and backtest tests, its
#              differential test against the same original engine plus 500
#              random events (seeded, so a failure reproduces), and the page
#              itself in headless Chromium.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# On a branch or a pull request, a newer push supersedes the run in progress.
# On main a run that has started is never cancelled. (GitHub still keeps only
# the newest of the runs waiting behind it.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  natorion:
    # Pinned: Playwright's --with-deps installs system packages by distro name,
    # so the browser test should not change OS under us when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-check
        run: node natorion/tests/self-check.js
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Browser test
        run: npm --prefix natorion i --no-audit --no-fund playwright@1.56.1 && node natorion/tests/browser.js
      - name: Parity with the original v12 engine
        run: node natorion/tests/parity.js 300

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: node web/tests/unit.node.js
      - name: Cycle echoes and backtest
        run: node web/tests/cycles.node.js
      - name: Parity with the original v12 engine, plus 500 random events
        run: node web/tests/parity.node.js --fuzz 500 --seed 138 --quiet
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Browser test
        # Playwright is installed outside the checkout, so nothing lands in web/.
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node web/tests/browser.js
