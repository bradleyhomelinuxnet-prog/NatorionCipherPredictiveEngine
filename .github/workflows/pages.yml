# Publishes the landing page, the Natorion app, the reverse-engineering
# report and the single-file build with every page it links to, to GitHub
# Pages on every push to main. The first run switches Pages
# on for the repository by itself (configure-pages `enablement`).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html site/
          cp Ophis_v12_ReverseEngineering_Report.html site/ 2>/dev/null || true
          # The single-file build, and every page reachable from it by clicking.
          # Without these it sits in the repo but never reaches the site.
          for f in OPHIS-Natorion-Cipher.html Ophis_v9_Explained.html OPHIS.html PSYFR1.html PSYFR2.html; do
            cp "$f" site/ 2>/dev/null || true
          done
          cp -R natorion site/natorion
          cp -R ophis site/ophis
          rm -rf site/natorion/node_modules site/natorion/tests site/natorion/package.json
          touch site/.nojekyll
          find site -type f | wc -l
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
