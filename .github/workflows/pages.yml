# Publishes the landing page, the three apps (Natorion, Ophis Web, and the
# original Ophis v12 in a browser), the reverse-engineering report, the
# Hardened Engine Lab, and the single-file build with every page it links to,
# to GitHub Pages on every push to main. Pages itself is switched on once, in
# the repository's Settings → Pages (Source: GitHub Actions).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. One that has started is allowed to finish; a newer
# push queues behind it instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p site
          # Every page the site links to: the landing page, the report, the Lab,
          # and the single-file build with every page reachable from it. A
          # missing one fails the build instead of going live as a 404.
          for f in index.html Ophis_v12_ReverseEngineering_Report.html Ophis_v12_Hardened_Engine_Lab.html \
                   OPHIS-Natorion-Cipher.html Ophis_v9_Explained.html OPHIS.html PSYFR1.html PSYFR2.html; do
            cp "$f" site/
          done
          cp -R natorion site/natorion
          cp -R ophis site/ophis
          # Ophis Web: the v12 engine with a new interface, kept apart from the
          # Chronicon and the clocks. It reads four data files from ../lib.
          cp -R web site/web
          rm -rf site/web/tests
          mkdir -p site/lib
          for f in astronomy.browser.min.js tz_lookup_oss.js solar_eclipses_processed.js lunar_eclipses_processed.js; do
            cp "lib/$f" site/lib/
          done
          rm -rf site/natorion/node_modules site/natorion/tests site/natorion/package.json
          touch site/.nojekyll
          find site -type f | wc -l
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
